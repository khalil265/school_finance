spring.application.name=school-finance-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/school_finance_db
spring.datasource.username=postgres
spring.datasource.password=Kh@lil01
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=school_finance
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.error.include-message=always
server.error.include-binding-errors=always
# ============================================================
# JWT SECURITY
# ============================================================

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=school-finance-backend
app.jwt.access-token-expiration-seconds=3600

# ============================================================
# INITIAL SUPER ADMIN
# ============================================================

app.bootstrap.admin.username=${ADMIN_INITIAL_USERNAME:admin}
app.bootstrap.admin.password=${ADMIN_INITIAL_PASSWORD: Admin@2026!}
app.bootstrap.admin.email=${ADMIN_INITIAL_EMAIL:imbaye813@gmail.com}

# ============================================================
# RECEIPT VERIFICATION
# ============================================================

app.receipt.public-base-url=${RECEIPT_PUBLIC_BASE_URL:http://localhost:8080/api/v1/public/receipts/verify}


# ============================================================
# EMAIL - GMAIL SMTP
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}